---
deployment:
  tasks:
    # Your live Node.js app folder (cPanel -> Setup Node.js App -> App Root Directory)
    - export APP=$HOME/fasih.technestnova.com/portfolio
    - /bin/mkdir -p $APP/tmp
    - /bin/rm -rf $APP/dist
    - /bin/cp -R dist $APP/dist
    - /bin/cp server.cjs package.json package-lock.json $APP/
    - /bin/cp -R lib $APP/
    # Restart the Node app so it serves the new files
    - /bin/touch $APP/tmp/restart.txt
